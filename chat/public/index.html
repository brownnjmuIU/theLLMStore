<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PPLLM Studio — Chat</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1a1a1a;
        --muted: #6b7280;
        --border: #e5e7eb;
        --user-bg: #2563eb;
        --user-fg: #ffffff;
        --bot-bg: #f3f4f6;
        --error-bg: #fef2f2;
        --error-fg: #991b1b;
        --error-border: #fecaca;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1115;
          --fg: #e8eaed;
          --muted: #9aa0a6;
          --border: #2a2e35;
          --user-bg: #3b82f6;
          --bot-bg: #1c1f26;
          --error-bg: #2a1416;
          --error-fg: #fca5a5;
          --error-border: #5b2326;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.55 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        display: flex;
        flex-direction: column;
        height: 100dvh;
      }
      header {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
      }
      header h1 {
        font-size: 15px;
        margin: 0;
        font-weight: 600;
      }
      header .spacer {
        flex: 1;
      }
      button {
        font: inherit;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
        padding: 6px 12px;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: var(--bot-bg);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 20px 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .msg {
        max-width: min(680px, 88%);
        padding: 10px 14px;
        border-radius: 14px;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .msg.user {
        align-self: flex-end;
        background: var(--user-bg);
        color: var(--user-fg);
        border-bottom-right-radius: 4px;
      }
      .msg.assistant {
        align-self: flex-start;
        background: var(--bot-bg);
        border-bottom-left-radius: 4px;
      }
      .msg.error {
        align-self: center;
        background: var(--error-bg);
        color: var(--error-fg);
        border: 1px solid var(--error-border);
        font-size: 14px;
        max-width: 680px;
      }
      .empty {
        color: var(--muted);
        text-align: center;
        margin: auto;
        max-width: 420px;
      }
      .typing {
        align-self: flex-start;
        color: var(--muted);
        font-size: 14px;
        padding: 0 4px;
      }
      form {
        display: flex;
        gap: 8px;
        padding: 12px 16px 16px;
        border-top: 1px solid var(--border);
        flex-shrink: 0;
        align-items: flex-end;
      }
      textarea {
        flex: 1;
        font: inherit;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        resize: none;
        max-height: 180px;
        min-height: 42px;
      }
      textarea:focus {
        outline: 2px solid var(--user-bg);
        outline-offset: -1px;
      }
      form button[type="submit"] {
        background: var(--user-bg);
        color: var(--user-fg);
        border-color: transparent;
        height: 42px;
        padding: 0 18px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>PPLLM Studio — Chat</h1>
      <span class="spacer"></span>
      <button id="reset" type="button">New chat</button>
    </header>

    <div id="log">
      <div class="empty" id="empty">Ask anything to get started.</div>
    </div>

    <form id="form">
      <textarea
        id="input"
        rows="1"
        placeholder="Send a message…  (Enter to send, Shift+Enter for a new line)"
        autofocus
      ></textarea>
      <button type="submit" id="send">Send</button>
    </form>

    <script type="module">
      const log = document.getElementById("log");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const send = document.getElementById("send");
      const reset = document.getElementById("reset");
      const empty = document.getElementById("empty");

      // The conversation lives here, in the browser. The server is stateless and
      // receives the whole history on every turn, so nothing to clear server-side.
      let messages = [];
      let busy = false;

      // textContent, never innerHTML. Model output is untrusted text; injecting it
      // as markup would be an XSS hole in a page we are about to make public.
      function addBubble(role, text) {
        empty.remove?.();
        const el = document.createElement("div");
        el.className = `msg ${role}`;
        el.textContent = text;
        log.appendChild(el);
        log.scrollTop = log.scrollHeight;
        return el;
      }

      function setBusy(state) {
        busy = state;
        send.disabled = state;
        input.disabled = state;
        if (!state) input.focus();
      }

      // Grow the textarea with its content instead of scrolling a one-line box.
      input.addEventListener("input", () => {
        input.style.height = "auto";
        input.style.height = `${input.scrollHeight}px`;
      });

      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          form.requestSubmit();
        }
      });

      reset.addEventListener("click", () => {
        messages = [];
        log.innerHTML = "";
        log.appendChild(empty);
        input.focus();
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text || busy) return;

        addBubble("user", text);
        messages.push({ role: "user", content: text });
        input.value = "";
        input.style.height = "auto";
        setBusy(true);

        const pending = document.createElement("div");
        pending.className = "typing";
        pending.textContent = "Thinking…";
        log.appendChild(pending);
        log.scrollTop = log.scrollHeight;

        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages }),
          });
          const data = await res.json().catch(() => ({}));
          pending.remove();

          if (!res.ok) {
            // The server already wrote a human-readable message; show it as-is.
            addBubble("error", data.error ?? `Request failed (${res.status}).`);
            // Drop the turn that failed so a retry does not resend a broken history.
            messages.pop();
            return;
          }

          addBubble("assistant", data.reply);
          messages.push({ role: "assistant", content: data.reply });
        } catch {
          pending.remove();
          addBubble(
            "error",
            "Could not reach the server. Check your connection and try again.",
          );
          messages.pop();
        } finally {
          setBusy(false);
        }
      });
    </script>
  </body>
</html>
